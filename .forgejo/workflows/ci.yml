name: CI

on:
  push:
  pull_request:

# Follow-up: add Lighthouse CI (treosh/lighthouse-ci-action) and axe-core
# via Playwright once the test suite has browser coverage.

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      # Before npm ci, so a Node pin that moved alone fails here, by name.
      - run: scripts/check-node-pins.sh
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
