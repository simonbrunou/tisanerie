name: Renovate config

on:
  push:
    paths:
      - renovate.json
      - .forgejo/workflows/renovate-config.yml
  pull_request:
    paths:
      - renovate.json
      - .forgejo/workflows/renovate-config.yml

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      # Keep the version equal to the ghcr.io/renovatebot/renovate tag in
      # renovate/renovate-config's .forgejo/workflows/renovate.yml, the
      # Renovate the bot runs. Run it without a file argument: given a path,
      # this version validates the file as global config, not as repo config.
      - run: npx --yes --package renovate@44.132.2 -- renovate-config-validator --strict
