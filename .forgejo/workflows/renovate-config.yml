name: Renovate config

on:
  push:
    paths:
      - renovate.json
      - scripts/check-renovate-config.*
      - .forgejo/workflows/renovate-config.yml
  pull_request:
    paths:
      - renovate.json
      - scripts/check-renovate-config.*
      - .forgejo/workflows/renovate-config.yml

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The script's tests first, so a broken check fails here, by name.
      - run: npx vitest run scripts/check-renovate-config.test.ts
        env:
          RENOVATE_CONFIG_TESTS: '1'
      - run: scripts/check-renovate-config.sh
